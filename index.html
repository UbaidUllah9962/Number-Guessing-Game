<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link rel="stylesheet" href="style.css" />
    <title>Guess My Number!</title>
  </head>
  <body>
    <canvas id="confetti-canvas"></canvas>

    <div class="game-container">
      <header>
        <h1>Guess My Number 🤔</h1>
        <p class="between">(Between 1 and <span class="max-number">20</span>)</p>

        <div class="difficulty-selector">
          <button class="btn-diff" data-level="easy">Easy (1-10)</button>
          <button class="btn-diff active" data-level="medium">Medium (1-20)</button>
          <button class="btn-diff" data-level="hard">Hard (1-100)</button>
        </div>

        <div class="number">?</div>
      </header>

      <main>
        <section class="left">
          <input type="number" class="guess" min="1" placeholder="?" />
          <div class="btn-row">
            <button class="btn check">Check!</button>
            <button class="btn again">🔄 Again!</button>
          </div>
        </section>

        <section class="right">
          <p class="message">Start guessing...</p>

          <div class="stats">
            <div class="stat-item">
              <span class="stat-icon">💯</span>
              <span>Score: <span class="score">20</span></span>
            </div>
            <div class="stat-item">
              <span class="stat-icon">🥇</span>
              <span>Highscore: <span class="highscore">0</span></span>
            </div>
            <div class="stat-item">
              <span class="stat-icon">⏱️</span>
              <span>Time: <span class="timer">0s</span></span>
            </div>
            <div class="stat-item">
              <span class="stat-icon">🔢</span>
              <span>Guesses: <span class="guess-count">0</span></span>
            </div>
          </div>

          <div class="history-section">
            <p class="history-title">Guess History</p>
            <div class="history"></div>
          </div>
        </section>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
